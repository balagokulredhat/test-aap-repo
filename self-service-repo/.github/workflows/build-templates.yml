name: Build portal templates

on:
  push:
    branches: [main]
    paths:
      - configs/**
      - data/**
      - generator/**
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r generator/requirements.txt
      - run: python3 generator/build_all.py
      - name: Commit generated templates
        run: |
          if git diff --quiet templates/ catalog-info.yaml; then
            echo "nothing changed"; exit 0
          fi
          git config user.name "template-bot"
          git config user.email "actions@github.com"
          git add templates/ catalog-info.yaml
          git commit -m "chore: rebuild portal templates"
          git push
